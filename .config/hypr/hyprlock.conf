# Hyprlock config

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor = eDP-1

    blur_passes = 1
    blur_size = 3

    path = ~/.config/hypr/images/wallpaper.png
}

label {
    monitor = eDP-1

    font_size = 18
    
    position = 0, 200
    
    halign = center
    valign = center
    
    color = rgba(205, 214, 244, 1)
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")" # Week day, month and day
}

label {
    monitor = eDP-1

    font_size = 100
    font_family = SF Pro Display Bold
    
    position = 0, 100
    
    halign = center
    valign = center
    
    color = rgba(205, 214, 244, 1)
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>" # Set time
}

input-field {
    monitor = eDP-1
    
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2

    size = 300, 60
    position = 0, -100
   
    dots_center = true
    fade_on_empty = false
    hide_input = false
    
    halign = center
    valign = center
    
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgb(186, 194, 222)
    
    placeholder_text =
}
